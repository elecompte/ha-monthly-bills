update_last_payment_date:
  name: Correct last payment date
  description: Corrects the latest recorded payment date and Last Paid display. Does not record a payment, advance the due date, or change paid status. Future dates are rejected.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
    paid_on:
      name: Correct payment date
      required: true
      selector:
        date: {}
add_bill:
  name: Add bill
  description: Creates a monthly bill sensor. Its bill_id is derived from its name (e.g. Electric -> electric).
  fields:
    name:
      name: Name
      required: true
      selector:
        text: {}
    cost:
      name: Amount (USD)
      required: true
      selector:
        number:
          min: 0
          max: 100000000
          step: 0.01
          mode: box
    due_date:
      name: First due date
      required: true
      selector:
        date: {}
    category:
      name: Category
      selector:
        text: {}
    auto_advance_due_date:
      name: Automatically advance due date
      selector:
        boolean: {}
    upcoming_threshold_days:
      name: Upcoming threshold (days)
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
update_bill:
  name: Edit bill
  description: Change any listed field of an existing bill. Leave unwanted fields omitted in YAML mode.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
    name:
      name: Name
      selector:
        text: {}
    cost:
      name: Amount (USD)
      selector:
        number:
          min: 0
          max: 100000000
          step: 0.01
          mode: box
    due_date:
      name: Due date
      selector:
        date: {}
    category:
      name: Category
      selector:
        text: {}
    auto_advance_due_date:
      name: Automatically advance due date
      selector:
        boolean: {}
    upcoming_threshold_days:
      name: Upcoming threshold (days)
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: box
mark_paid:
  name: Mark paid
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
mark_unpaid:
  name: Mark unpaid
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
rollover:
  name: Advance to next month
  description: Archives a paid, unadvanced occurrence and opens next month. Rejects already auto-advanced cycles.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
delete_bill:
  name: Delete bill
  description: Permanently removes the bill and its stored history.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
pay_next_cycle:
  name: Pay next cycle early
  description: Records a new payment for the displayed due date even while status is Paid from the previous cycle. Every call may pay another cycle; do not use for retrying mark_paid.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
