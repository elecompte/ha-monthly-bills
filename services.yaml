add_bill:
  name: Add bill
  description: Creates a monthly bill sensor. Its bill_id is derived from its name (e.g. Electric -> electric).
  fields:
    name:
      name: Name
      required: true
      selector:
        text: {}
    cost:
      name: Amount (USD)
      required: true
      selector:
        number:
          min: 0
          max: 100000000
          step: 0.01
          mode: box
    due_date:
      name: First due date
      required: true
      selector:
        date: {}
    category:
      name: Category
      selector:
        text: {}
update_bill:
  name: Edit bill
  description: Change any listed field of an existing bill. Leave unwanted fields omitted in YAML mode.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
    name:
      name: Name
      selector:
        text: {}
    cost:
      name: Amount (USD)
      selector:
        number:
          min: 0
          max: 100000000
          step: 0.01
          mode: box
    due_date:
      name: Due date
      selector:
        date: {}
    category:
      name: Category
      selector:
        text: {}
mark_paid:
  name: Mark paid
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
mark_unpaid:
  name: Mark unpaid
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
rollover:
  name: Advance to next month
  description: Archives a paid occurrence and opens next month's occurrence. Unpaid bills cannot be rolled over.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
delete_bill:
  name: Delete bill
  description: Permanently removes the bill and its stored history.
  fields:
    bill_id:
      name: Bill ID
      required: true
      selector:
        text: {}
